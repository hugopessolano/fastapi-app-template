services:
  api:
    build: .
    container_name: fastapi_template_api
    env_file:
      - .env
    ports:
      - '8000:8000'
    volumes:
      - ./:/code
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --workers 1

  scaffold-api:
    build:
      context: .
      dockerfile: tools/scaffold/api/Dockerfile
    container_name: fastapi_template_scaffold_api
    ports:
      - '8001:8001'
    volumes:
      - ./:/code
    command: python -m tools.scaffold.api

  scaffold-ui:
    build:
      context: .
      dockerfile: tools/scaffold/ui/Dockerfile
    container_name: fastapi_template_scaffold_ui
    environment:
      - NEXT_PUBLIC_SCAFFOLD_API_URL=http://localhost:8001
    ports:
      - '3000:3000'
    volumes:
      - ./tools/scaffold/ui:/ui
      - /ui/node_modules
    command: npm run dev -- -H 0.0.0.0 -p 3000
    depends_on:
      - scaffold-api
