services:
  scaffold-api:
    build:
      context: ../..
      dockerfile: tools/scaffold/api/Dockerfile
    container_name: scaffold_api
    environment:
      - SCAFFOLD_TEMPLATE_ROOT=/code
      - SCAFFOLD_PROJECTS_ROOT=/code
    ports:
      - "8001:8001"
    volumes:
      - ../..:/code
    command: python -m tools.scaffold.api

  scaffold-ui:
    build:
      context: ../..
      dockerfile: tools/scaffold/ui/Dockerfile
    container_name: scaffold_ui
    environment:
      - NEXT_PUBLIC_SCAFFOLD_API_URL=http://localhost:8001
    ports:
      - "3000:3000"
    volumes:
      - ../../tools/scaffold/ui:/ui
      - /ui/node_modules
    command: npm run dev -- -H 0.0.0.0 -p 3000
    depends_on:
      - scaffold-api
